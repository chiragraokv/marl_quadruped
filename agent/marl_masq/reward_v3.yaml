rewards:
  # --- Task ---
  - id: track_lin_vel_xy
    type: task
    scale: 1.5
    equation: "exp(-||v_cmd_xy - v_b_xy||^2 / sigma_lin)"   # sigma_lin ~ 0.25

  - id: track_ang_vel_z
    type: task
    scale: 0.75
    equation: "exp(-(w_cmd_z - w_b_z)^2 / sigma_yaw)"        # sigma_yaw ~ 0.25

  # --- Stability (keeps the base up) ---
  - id: body_orientation
    type: stability
    scale: -1.0
    equation: "||g_b_xy||^2"

  - id: lin_vel_z
    type: stability
    scale: -2.0
    equation: "v_b_z^2"

  - id: ang_vel_xy
    type: stability
    scale: -0.05
    equation: "||omega_b_xy||^2"

  - id: base_height
    type: stability
    scale: -10.0
    equation: "(h_base - h_target)^2"    # fixed nominal height, no jump command

  # --- Gait ---
  - id: feet_air_time
    type: gait
    scale: 1.0
    equation: "sum((t_air_i - 0.5) * first_contact_i)"   # reward only on touchdown

  - id: feet_slip
    type: gait
    scale: -0.1
    equation: "sum(contact_i * ||v_foot_i_xy||^2)"

  - id: undesired_contact
    type: gait
    scale: -1.0
    equation: "count(nonfoot_ground_contact)"

  # NEW — closes the "foot never leaves the ground" loophole in feet_air_time.
  # A foot that never steps contributes 0 to feet_air_time (neither reward nor
  # penalty), so a robot that just plants all 4 feet and freezes was never
  # punished for it. This penalizes any foot that's been in stance too long
  # without lifting, only once it's overdue — normal standing/weight-shifting
  # steps won't trigger it.
  - id: feet_stance_time
    type: gait
    scale: -0.05
    equation: "sum(max(0, t_stance_i - stance_limit) for foot_i in contact)"
    notes: "stance_limit ~ 1.0-1.5s. Penalizes a planted foot that never lifts."

  # NEW — directly penalizes "ignore the command and freeze" when a nonzero
  # velocity command is active. This was the core exploit: every other term
  # was ~0 or minimal-cost while standing still, so there was nothing pushing
  # the policy toward actually executing commanded motion.
  - id: stand_still_penalty
    type: gait
    scale: -1.0
    equation: "||v_cmd_xy|| > eps_cmd ? exp(-||qdot||^2 / sigma_still) : 0"
    notes: >
      eps_cmd ~ 0.1 m/s (only active when a real movement command is given).
      sigma_still ~ 0.1. Near-zero joint velocity under a live command gets
      penalized; standing still under a zero-velocity command costs nothing.

  # --- Regularization ---
  - id: torques
    type: regularization
    scale: -1.0e-5
    equation: "sum(tau_i^2)"

  - id: dof_acc
    type: regularization
    scale: -2.5e-7
    equation: "sum(qddot_i^2)"

  - id: action_rate
    type: regularization
    scale: -0.01
    equation: "||a_t - a_(t-1)||^2"

  # CHANGED — survival used to be pure f(t), i.e. free reward for staying
  # alive regardless of whether the robot was doing anything useful. That's
  # what let a frozen-but-balanced robot farm ~0.5/step forever. It's now
  # gated by the same tracking-quality kernel as track_lin_vel_xy, so it's
  # only "free" when v_cmd≈0 is genuinely the commanded behavior (i.e.
  # standing still is correct), and is suppressed whenever the robot is
  # ignoring a real movement command.
  - id: survival
    name: Survival Bonus
    type: task
    scale: 0.5
    equation: "(1 - exp(-t / tau_s)) * exp(-||v_cmd_xy - v_b_xy||^2 / sigma_lin)"
    notes: >
      tau_s=1.0s; ramped 0→1 over first 200 PPO iterations, as before.
      Tracking-quality term reuses sigma_lin from track_lin_vel_xy so the
      bonus requires actually tracking the command, not just existing.
